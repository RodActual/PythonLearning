<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0f1f" />
    <script>
      // Apply the saved theme before first paint so the page never flashes the wrong colors.
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
          var dark = t === 'dark' || (t !== 'light' && !matchMedia('(prefers-color-scheme: light)').matches);
          document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#0a0f1f' : '#f3f6fb');
        } catch (e) {}
      })();
    </script>
    <title>Python Learning Path</title>
    <meta name="description" content="Learn Python step by step with quizzes, coding challenges, XP, and trophies." />
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>
</html>
