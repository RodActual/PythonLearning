version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR for routine minor/patch bumps instead of many.
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /firestore-tests
    schedule:
      interval: monthly
  - package-ecosystem: pip
    # The onboarding track's Python packages (requirements.txt, constraints.txt).
    directory: /onboarding
    schedule:
      interval: monthly
    groups:
      # constraints.txt pins the whole set, and many pins must move together
      # (e.g. pydantic and pydantic-core), so routine bumps come in one PR.
      # Major versions stay separate so one breaking bump can't hold back patches.
      onboarding-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
