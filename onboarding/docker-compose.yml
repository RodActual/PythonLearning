# Local stack: the API plus a single-node OpenSearch with security off. Not for production.
services:
  opensearch:
    image: opensearchproject/opensearch:2.17.1
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      retries: 12

  api:
    build: .
    environment:
      CATALOG_SEARCH_BACKEND: opensearch
      CATALOG_OPENSEARCH_URL: http://opensearch:9200
    ports:
      - "8000:8000"
    volumes:
      - catalog-data:/data
    depends_on:
      opensearch:
        condition: service_healthy

volumes:
  catalog-data:
